<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Quality engineering throughout a project</title><desc id="desc">Twelve activities from discovery through requirements, design, planning, development, integration, exploration, investigation, retesting, release, observation, and improvement. Feedback loops revisit earlier decisions.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47617a"/></marker></defs><rect width="1200" height="940" fill="#f5f8fc"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172b43"><text x="60" y="50" font-size="30" font-weight="700">QE is a continuous learning loop</text><text x="60" y="84" font-size="18">Follow the arrows. Revisit earlier work whenever evidence changes your understanding.</text><g stroke="#47617a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M380 190H436"/><path d="M760 190H816"/><path d="M980 250V321"/><path d="M820 385H764"/><path d="M440 385H384"/><path d="M220 445V516"/><path d="M380 580H436"/><path d="M760 580H816"/><path d="M980 640V711"/><path d="M820 775H764"/><path d="M440 775H384"/><path d="M60 775H22V190H55" stroke-dasharray="6 6"/></g><rect x="60" y="130" width="320" height="120" rx="12" fill="#dbeafe" stroke="#7891aa"/><text x="76" y="161" font-size="21" font-weight="700">01 Discover</text><text x="76" y="193" font-size="16">Who uses it? Who could be harmed?</text><text x="76" y="224" font-size="14">Output: questions and user journey</text><rect x="440" y="130" width="320" height="120" rx="12" fill="#dbeafe" stroke="#7891aa"/><text x="456" y="161" font-size="21" font-weight="700">02 Specify</text><text x="456" y="193" font-size="16">What result would be correct?</text><text x="456" y="224" font-size="14">Output: observable acceptance criteria</text><rect x="820" y="130" width="320" height="120" rx="12" fill="#dbeafe" stroke="#7891aa"/><text x="836" y="161" font-size="21" font-weight="700">03 Review design</text><text x="836" y="193" font-size="16">Where can state or data be lost?</text><text x="836" y="224" font-size="14">Output: risks and state model</text><rect x="820" y="325" width="320" height="120" rx="12" fill="#dbeafe" stroke="#7891aa"/><text x="836" y="356" font-size="21" font-weight="700">04 Plan</text><text x="836" y="388" font-size="16">What should we learn first?</text><text x="836" y="419" font-size="14">Output: ranked risks and coverage</text><rect x="440" y="325" width="320" height="120" rx="12" fill="#dcfce7" stroke="#7891aa"/><text x="456" y="356" font-size="21" font-weight="700">05 Build together</text><text x="456" y="388" font-size="16">What small check helps early?</text><text x="456" y="419" font-size="14">Output: component evidence</text><rect x="60" y="325" width="320" height="120" rx="12" fill="#dcfce7" stroke="#7891aa"/><text x="76" y="356" font-size="21" font-weight="700">06 Integrate</text><text x="76" y="388" font-size="16">Do contracts and state agree?</text><text x="76" y="419" font-size="14">Output: API and persistence results</text><rect x="60" y="520" width="320" height="120" rx="12" fill="#dcfce7" stroke="#7891aa"/><text x="76" y="551" font-size="21" font-weight="700">07 Explore</text><text x="76" y="583" font-size="16">What did scripted checks miss?</text><text x="76" y="614" font-size="14">Output: charter and observations</text><rect x="440" y="520" width="320" height="120" rx="12" fill="#dcfce7" stroke="#7891aa"/><text x="456" y="551" font-size="21" font-weight="700">08 Investigate</text><text x="456" y="583" font-size="16">Which explanation fits evidence?</text><text x="456" y="614" font-size="14">Output: reproducible defect or question</text><rect x="820" y="520" width="320" height="120" rx="12" fill="#dcfce7" stroke="#7891aa"/><text x="836" y="551" font-size="21" font-weight="700">09 Verify changes</text><text x="836" y="583" font-size="16">Did the fix work? What else changed?</text><text x="836" y="614" font-size="14">Output: retest and regression evidence</text><rect x="820" y="715" width="320" height="120" rx="12" fill="#ede9fe" stroke="#7891aa"/><text x="836" y="746" font-size="21" font-weight="700">10 Decide release</text><text x="836" y="778" font-size="16">What risks and gaps remain?</text><text x="836" y="809" font-size="14">Output: summary and named decision</text><rect x="440" y="715" width="320" height="120" rx="12" fill="#ede9fe" stroke="#7891aa"/><text x="456" y="746" font-size="21" font-weight="700">11 Observe</text><text x="456" y="778" font-size="16">What does real use reveal?</text><text x="456" y="809" font-size="14">Output: incidents and feedback</text><rect x="60" y="715" width="320" height="120" rx="12" fill="#ede9fe" stroke="#7891aa"/><text x="76" y="746" font-size="21" font-weight="700">12 Improve</text><text x="76" y="778" font-size="16">How could we prevent recurrence?</text><text x="76" y="809" font-size="14">Output: updated design, cases, and plan</text><text x="60" y="892" font-size="18" font-weight="700">Every stage produces evidence, questions, or decisions—not just test-case counts.</text><text x="60" y="920" font-size="16">A release recommendation states scope, residual risk, conditions, and who owns the decision.</text></g></svg>
