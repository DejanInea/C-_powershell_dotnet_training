<svg xmlns="http://www.w3.org/2000/svg" width="920" height="810" viewBox="0 0 920 810" role="img" aria-labelledby="title desc"><title id="title">Risk scoring matrix for the QE course</title><desc id="desc">Likelihood times impact. Scores 15 and above are high, 8 through 14 medium, below 8 low. Any impact five scenario is high regardless of score. Estimates prioritize investigation and do not establish defects.</desc><rect width="920" height="810" fill="#f5f8fc"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172b43"><text x="50" y="50" font-size="29" font-weight="700">Choose what to investigate first</text><text x="50" y="88" font-size="18">Course convention: score = likelihood × impact; impact 5 always High.</text><text x="445" y="140" text-anchor="middle" font-size="20" font-weight="700">Likelihood →</text><text x="50" y="185" font-size="18" font-weight="700">Impact</text><text x="185" y="185" text-anchor="middle" font-size="19">1</text><text x="310" y="185" text-anchor="middle" font-size="19">2</text><text x="435" y="185" text-anchor="middle" font-size="19">3</text><text x="560" y="185" text-anchor="middle" font-size="19">4</text><text x="685" y="185" text-anchor="middle" font-size="19">5</text><text x="75" y="255" text-anchor="middle" font-size="20">5</text><rect x="125" y="210" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="185" y="243" text-anchor="middle" font-size="23" font-weight="700">5</text><text x="185" y="270" text-anchor="middle" font-size="15">High</text><rect x="250" y="210" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="310" y="243" text-anchor="middle" font-size="23" font-weight="700">10</text><text x="310" y="270" text-anchor="middle" font-size="15">High</text><rect x="375" y="210" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="435" y="243" text-anchor="middle" font-size="23" font-weight="700">15</text><text x="435" y="270" text-anchor="middle" font-size="15">High</text><rect x="500" y="210" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="560" y="243" text-anchor="middle" font-size="23" font-weight="700">20</text><text x="560" y="270" text-anchor="middle" font-size="15">High</text><rect x="625" y="210" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="685" y="243" text-anchor="middle" font-size="23" font-weight="700">25</text><text x="685" y="270" text-anchor="middle" font-size="15">High</text><text x="75" y="343" text-anchor="middle" font-size="20">4</text><rect x="125" y="298" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="185" y="331" text-anchor="middle" font-size="23" font-weight="700">4</text><text x="185" y="358" text-anchor="middle" font-size="15">Low</text><rect x="250" y="298" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="310" y="331" text-anchor="middle" font-size="23" font-weight="700">8</text><text x="310" y="358" text-anchor="middle" font-size="15">Medium</text><rect x="375" y="298" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="435" y="331" text-anchor="middle" font-size="23" font-weight="700">12</text><text x="435" y="358" text-anchor="middle" font-size="15">Medium</text><rect x="500" y="298" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="560" y="331" text-anchor="middle" font-size="23" font-weight="700">16</text><text x="560" y="358" text-anchor="middle" font-size="15">High</text><rect x="625" y="298" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="685" y="331" text-anchor="middle" font-size="23" font-weight="700">20</text><text x="685" y="358" text-anchor="middle" font-size="15">High</text><text x="75" y="431" text-anchor="middle" font-size="20">3</text><rect x="125" y="386" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="185" y="419" text-anchor="middle" font-size="23" font-weight="700">3</text><text x="185" y="446" text-anchor="middle" font-size="15">Low</text><rect x="250" y="386" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="310" y="419" text-anchor="middle" font-size="23" font-weight="700">6</text><text x="310" y="446" text-anchor="middle" font-size="15">Low</text><rect x="375" y="386" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="435" y="419" text-anchor="middle" font-size="23" font-weight="700">9</text><text x="435" y="446" text-anchor="middle" font-size="15">Medium</text><rect x="500" y="386" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="560" y="419" text-anchor="middle" font-size="23" font-weight="700">12</text><text x="560" y="446" text-anchor="middle" font-size="15">Medium</text><rect x="625" y="386" width="120" height="80" rx="7" fill="#fee2e2" stroke="#b3c3d2"/><text x="685" y="419" text-anchor="middle" font-size="23" font-weight="700">15</text><text x="685" y="446" text-anchor="middle" font-size="15">High</text><text x="75" y="519" text-anchor="middle" font-size="20">2</text><rect x="125" y="474" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="185" y="507" text-anchor="middle" font-size="23" font-weight="700">2</text><text x="185" y="534" text-anchor="middle" font-size="15">Low</text><rect x="250" y="474" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="310" y="507" text-anchor="middle" font-size="23" font-weight="700">4</text><text x="310" y="534" text-anchor="middle" font-size="15">Low</text><rect x="375" y="474" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="435" y="507" text-anchor="middle" font-size="23" font-weight="700">6</text><text x="435" y="534" text-anchor="middle" font-size="15">Low</text><rect x="500" y="474" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="560" y="507" text-anchor="middle" font-size="23" font-weight="700">8</text><text x="560" y="534" text-anchor="middle" font-size="15">Medium</text><rect x="625" y="474" width="120" height="80" rx="7" fill="#fef3c7" stroke="#b3c3d2"/><text x="685" y="507" text-anchor="middle" font-size="23" font-weight="700">10</text><text x="685" y="534" text-anchor="middle" font-size="15">Medium</text><text x="75" y="607" text-anchor="middle" font-size="20">1</text><rect x="125" y="562" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="185" y="595" text-anchor="middle" font-size="23" font-weight="700">1</text><text x="185" y="622" text-anchor="middle" font-size="15">Low</text><rect x="250" y="562" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="310" y="595" text-anchor="middle" font-size="23" font-weight="700">2</text><text x="310" y="622" text-anchor="middle" font-size="15">Low</text><rect x="375" y="562" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="435" y="595" text-anchor="middle" font-size="23" font-weight="700">3</text><text x="435" y="622" text-anchor="middle" font-size="15">Low</text><rect x="500" y="562" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="560" y="595" text-anchor="middle" font-size="23" font-weight="700">4</text><text x="560" y="622" text-anchor="middle" font-size="15">Low</text><rect x="625" y="562" width="120" height="80" rx="7" fill="#dcfce7" stroke="#b3c3d2"/><text x="685" y="595" text-anchor="middle" font-size="23" font-weight="700">5</text><text x="685" y="622" text-anchor="middle" font-size="15">Low</text><text x="50" y="700" font-size="18" font-weight="700">High: ≥15 or impact 5 • Medium: 8–14 • Low: 1–7</text><text x="50" y="740" font-size="17">Scores are estimates, not probabilities or evidence of a defect.</text><text x="50" y="773" font-size="17">Record the trigger, user harm, expected protection, scope, and next experiment.</text></g></svg>
